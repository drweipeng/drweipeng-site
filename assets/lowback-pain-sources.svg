<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" role="img" aria-label="打掃後腰酸，常見的六個疼痛來源" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="13"><rect width="760" height="484" fill="#ffffff"/><text x="24" y="34" font-size="15" fill="#1f2328" font-weight="600">打掃後腰酸，常見的六個疼痛來源</text><text x="24" y="56" font-size="11.5" fill="#5f6670">下背部後視示意圖</text><g fill="none" stroke="#9aa0a6" stroke-width="1.25"><rect x="222" y="80" width="56" height="34" rx="6"/><rect x="222" y="124" width="56" height="34" rx="6"/><rect x="222" y="168" width="56" height="34" rx="6"/><rect x="222" y="212" width="56" height="34" rx="6"/><rect x="222" y="256" width="56" height="34" rx="6"/><rect x="194" y="92" width="28" height="10" rx="3"/><rect x="278" y="92" width="28" height="10" rx="3"/><rect x="194" y="136" width="28" height="10" rx="3"/><rect x="278" y="136" width="28" height="10" rx="3"/><rect x="194" y="180" width="28" height="10" rx="3"/><rect x="278" y="180" width="28" height="10" rx="3"/><rect x="194" y="224" width="28" height="10" rx="3"/><rect x="278" y="224" width="28" height="10" rx="3"/><rect x="186" y="268" width="36" height="10" rx="3"/><rect x="278" y="268" width="36" height="10" rx="3"/><path d="M222 92Q170 96 128 128"/><path d="M278 92Q330 96 372 128"/><polygon points="200,300 300,300 275,400 250,420 225,400"/><path d="M205 310L170 252Q120 236 70 262L84 360Q130 410 170 420L215 392Z"/><path d="M295 310L330 252Q380 236 430 262L416 360Q370 410 330 420L285 392Z"/></g><text x="250" y="277" font-size="11" fill="#5f6670" text-anchor="middle">L5</text><text x="250" y="345" font-size="11" fill="#5f6670" text-anchor="middle">薦骨</text><text x="392" y="340" font-size="11" fill="#5f6670" text-anchor="middle">髂骨</text><text x="122" y="133" font-size="11" fill="#5f6670" text-anchor="end">第12肋</text><rect x="176" y="84" width="40" height="214" rx="16" fill="#2f6fdb" fill-opacity="0.18" stroke="#2f6fdb" stroke-width="1.5"/><circle cx="196" cy="140" r="11" fill="#2f6fdb" fill-opacity="0.25" stroke="#2f6fdb" stroke-width="2"/><text x="196" y="144.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">1</text><rect x="276" y="150" width="26" height="196" rx="10" fill="#e8743b" fill-opacity="0.22" stroke="#e8743b" stroke-width="1.5"/><circle cx="289" cy="180" r="11" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="2"/><text x="289" y="184.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">2</text><polygon points="312,110 372,128 395,244 332,254" fill="#1fa37a" fill-opacity="0.18" stroke="#1fa37a" stroke-width="1.5"/><circle cx="355" cy="182" r="11" fill="#1fa37a" fill-opacity="0.25" stroke="#1fa37a" stroke-width="2"/><text x="355" y="186.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">3</text><ellipse cx="120" cy="320" rx="38" ry="34" fill="#1d3d6e" fill-opacity="0.18" stroke="#1d3d6e" stroke-width="1.5"/><circle cx="120" cy="320" r="11" fill="#1d3d6e" fill-opacity="0.25" stroke="#1d3d6e" stroke-width="2"/><text x="120" y="324.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">4</text><line x1="188" y1="272" x2="148" y2="250" stroke="#d6457a" stroke-width="4" stroke-linecap="round"/><line x1="312" y1="272" x2="352" y2="250" stroke="#d6457a" stroke-width="4" stroke-linecap="round"/><circle cx="374" cy="268" r="11" fill="#d6457a" fill-opacity="0.25" stroke="#d6457a" stroke-width="2"/><text x="374" y="272.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">5</text><line x1="208" y1="305" x2="224" y2="392" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/><line x1="292" y1="305" x2="276" y2="392" stroke="#1a8a3a" stroke-width="4" stroke-linecap="round"/><circle cx="194" cy="372" r="11" fill="#1a8a3a" fill-opacity="0.25" stroke="#1a8a3a" stroke-width="2"/><text x="194" y="376.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">6</text><circle cx="482" cy="96" r="11" fill="#2f6fdb" fill-opacity="0.25" stroke="#2f6fdb" stroke-width="2"/><text x="482" y="100.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">1</text><text x="502" y="101" font-size="13" fill="#1f2328" font-weight="600">豎脊肌</text><text x="502" y="121" font-size="11.5" fill="#5f6670">前彎時撐住上半身，負擔最大</text><circle cx="482" cy="152" r="11" fill="#e8743b" fill-opacity="0.25" stroke="#e8743b" stroke-width="2"/><text x="482" y="156.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">2</text><text x="502" y="157" font-size="13" fill="#1f2328" font-weight="600">多裂肌</text><text x="502" y="177" font-size="11.5" fill="#5f6670">脊椎旁深層小肌肉，負責穩定</text><circle cx="482" cy="208" r="11" fill="#1fa37a" fill-opacity="0.25" stroke="#1fa37a" stroke-width="2"/><text x="482" y="212.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">3</text><text x="502" y="213" font-size="13" fill="#1f2328" font-weight="600">腰方肌</text><text x="502" y="233" font-size="11.5" fill="#5f6670">單邊出力、側彎時容易疲勞</text><circle cx="482" cy="264" r="11" fill="#1d3d6e" fill-opacity="0.25" stroke="#1d3d6e" stroke-width="2"/><text x="482" y="268.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">4</text><text x="502" y="269" font-size="13" fill="#1f2328" font-weight="600">臀中肌</text><text x="502" y="289" font-size="11.5" fill="#5f6670">穩定骨盆，痛點常被當成腰痛</text><circle cx="482" cy="320" r="11" fill="#d6457a" fill-opacity="0.25" stroke="#d6457a" stroke-width="2"/><text x="482" y="324.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">5</text><text x="502" y="325" font-size="13" fill="#1f2328" font-weight="600">髂腰韌帶</text><text x="502" y="345" font-size="11.5" fill="#5f6670">腰椎與骨盆交界，前傾時被拉扯</text><circle cx="482" cy="376" r="11" fill="#1a8a3a" fill-opacity="0.25" stroke="#1a8a3a" stroke-width="2"/><text x="482" y="380.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">6</text><text x="502" y="381" font-size="13" fill="#1f2328" font-weight="600">薦髂關節</text><text x="502" y="401" font-size="11.5" fill="#5f6670">最簡單、卻常被忽略的腰痛來源</text><text x="24" y="464" font-size="11.5" fill="#5f6670">示意圖，非實際解剖比例；部分構造只畫在單側，方便辨識</text></svg>