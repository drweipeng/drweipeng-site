<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-label="三個平時就能做的腰臀肌力訓練" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="13"><rect width="760" height="324" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fdb"/></marker></defs><text x="24" y="34" font-size="15" fill="#1f2328" font-weight="600">三個平時就能做的腰臀肌力訓練</text><line x1="258" y1="60" x2="258" y2="284" stroke="#dfe2e6"/><line x1="502" y1="60" x2="502" y2="284" stroke="#dfe2e6"/><text x="24" y="72" font-size="13" fill="#1f2328" font-weight="600">橋式</text><line x1="24" y1="230" x2="240" y2="230" stroke="#dfe2e6" stroke-width="1.5"/><line x1="74" y1="226" x2="154" y2="186" stroke="#2f6fdb" stroke-width="10" stroke-opacity="0.3" stroke-linecap="round"/><g fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="54" cy="219" r="10"/><path d="M74 226L154 186L194 168L204 228H219"/><path d="M74 228H124"/></g><circle cx="154" cy="186" r="12" fill="#2f6fdb" fill-opacity="0.18" stroke="#2f6fdb" stroke-width="2"/><path d="M154 168V136" stroke="#2f6fdb" stroke-width="1.5" marker-end="url(#ar)"/><text x="24" y="260" font-size="11.5" fill="#1f2328">仰躺屈膝，臀部出力抬起骨盆</text><text x="24" y="280" font-size="11.5" fill="#5f6670">訓練：臀肌</text><text x="268" y="72" font-size="13" fill="#1f2328" font-weight="600">鳥狗式</text><line x1="268" y1="230" x2="484" y2="230" stroke="#dfe2e6" stroke-width="1.5"/><line x1="338" y1="170" x2="408" y2="170" stroke="#2f6fdb" stroke-width="10" stroke-opacity="0.3" stroke-linecap="round"/><g fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="322" cy="153" r="10"/><path d="M338 170H408"/><path d="M338 170V228"/><path d="M338 170L286 174"/><path d="M408 170V228H443"/><path d="M408 170L478 164"/></g><text x="268" y="260" font-size="11.5" fill="#1f2328">四足跪姿，對側手腳同時伸直</text><text x="268" y="280" font-size="11.5" fill="#5f6670">訓練：軀幹穩定</text><text x="512" y="72" font-size="13" fill="#1f2328" font-weight="600">側棒式</text><line x1="512" y1="230" x2="736" y2="230" stroke="#dfe2e6" stroke-width="1.5"/><line x1="572" y1="194.5" x2="652" y2="212.5" stroke="#2f6fdb" stroke-width="10" stroke-opacity="0.3" stroke-linecap="round"/><g fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="533" cy="183" r="10"/><path d="M552 190L712 226"/><path d="M582 228H552V190"/></g><text x="512" y="260" font-size="11.5" fill="#1f2328">前臂撐地，身體側面成一直線</text><text x="512" y="280" font-size="11.5" fill="#5f6670">訓練：腰方肌、側腹</text><text x="24" y="308" font-size="11.5" fill="#5f6670">示意圖；做動作時若引發疼痛或腿麻，請停止並請醫師評估</text></svg>