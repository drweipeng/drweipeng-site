<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" aria-label="從髖關節彎，讓臀腿分擔腰的工作" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="13"><rect width="760" height="404" fill="#ffffff"/><text x="24" y="34" font-size="15" fill="#1f2328" font-weight="600">從髖關節彎，讓臀腿分擔腰的工作</text><line x1="380" y1="60" x2="380" y2="384" stroke="#dfe2e6"/><text x="40" y="76" font-size="13" fill="#d13c3c" font-weight="600">✕ 從腰彎</text><line x1="40" y1="340" x2="350" y2="340" stroke="#dfe2e6" stroke-width="1.5"/><g fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M175 340H150V270V200"/><path d="M150 200Q160 135 230 150"/><path d="M222 153L224 232"/><circle cx="243" cy="166" r="16"/></g><circle cx="156" cy="176" r="15" fill="#d13c3c" fill-opacity="0.15" stroke="#d13c3c" stroke-width="2"/><line x1="124" y1="176" x2="140" y2="176" stroke="#d13c3c" stroke-width="1.25"/><text x="40" y="172" font-size="11.5" fill="#1f2328" font-weight="600">腰椎彎曲</text><text x="40" y="190" font-size="11.5" fill="#5f6670">背肌撐住上半身</text><text x="164" y="290" font-size="11.5" fill="#5f6670">膝蓋打直</text><text x="40" y="374" font-size="13" fill="#1f2328" font-weight="600">腰背肌負擔較大</text><text x="404" y="76" font-size="13" fill="#1a8a3a" font-weight="600">✓ 髖關節鉸鏈</text><line x1="404" y1="340" x2="720" y2="340" stroke="#dfe2e6" stroke-width="1.5"/><line x1="495" y1="205" x2="535" y2="275" stroke="#1a8a3a" stroke-width="10" stroke-opacity="0.3" stroke-linecap="round"/><g fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M545 340H520L535 275L495 205"/><path d="M495 205L590 155"/><path d="M590 155L595 232"/><circle cx="606" cy="146" r="16"/></g><circle cx="495" cy="205" r="15" fill="#1a8a3a" fill-opacity="0.15" stroke="#1a8a3a" stroke-width="2"/><line x1="466" y1="205" x2="479" y2="205" stroke="#1a8a3a" stroke-width="1.25"/><text x="404" y="209" font-size="11.5" fill="#1